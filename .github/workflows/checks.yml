name: 🧪 Quality Checks

on:
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      ref:
        description: Commit to validate; defaults to the triggering event
        required: false
        type: string

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📦 Unpack the source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: ⚡ Power up Node & Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.11.1
          node-version-file: .node-version

      - name: 🛠️ Equip the task runner
        uses: arduino/setup-task@v3
        with:
          version: "3.54.0"

      - name: 🧩 Gather dependencies
        run: nub ci

      - name: ✨ Polish the code
        run: task lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📦 Unpack the source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: ⚡ Power up Node & Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.11.1
          node-version-file: .node-version

      - name: 🛠️ Equip the task runner
        uses: arduino/setup-task@v3
        with:
          version: "3.54.0"

      - name: 🧩 Gather dependencies
        run: nub ci

      - name: 🔒 Verify release PRs into main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          version=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')
          test "$PR_HEAD_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "$PR_HEAD_REF" = "release/$version" || {
            echo 'Only release/<package version> branches may merge into main.' >&2
            exit 1
          }
          base_version=$(git show "$BASE_SHA:package.json" | node -p 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')
          range=">$base_version"
          if test -z "$(git tag --list 'v[0-9]*')"; then
            range=">=$base_version"
          fi
          test "$(nub exec semver "$version" -r "$range")" = "$version"
          if git show-ref --verify --quiet "refs/tags/v$version"; then
            echo 'This package version has already been tagged.' >&2
            exit 1
          fi

      - name: 🔍 Check the types
        run: task typecheck

      - name: 🧪 Put the site to the test
        run: task test
      - name: 🛰️ Rehearse the launch
        run: task deploy:check
