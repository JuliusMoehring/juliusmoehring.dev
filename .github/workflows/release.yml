name: 📦 Release and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false
  queue: max

jobs:
  checks:
    name: Validate release
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.sha }}

  release:
    name: Tag and publish release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 📦 Unpack the release commit and tags
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 🏷️ Publish this commit's package version
        id: release
        run: |
          version=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')
          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA" || {
              echo 'This version is already tagged at another commit.' >&2
              exit 1
            }
          fi
          if published=$(gh release view "$tag" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease) | not'); then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
            test "$published" = true || {
              echo 'Resolve the existing draft or prerelease before deploying.' >&2
              exit 1
            }
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy released site
    needs: release
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.release.outputs.sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
