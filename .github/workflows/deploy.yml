name: 🚀 Deploy to Cloudflare

on:
  push:
    branches: [main]

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Validate deployment
    uses: ./.github/workflows/checks.yml

  deploy:
    name: Deploy site
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📦 Unpack the source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: ⚡ Power up Node & Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.11.1
          node-version-file: .node-version

      - name: 🛠️ Equip the task runner
        uses: arduino/setup-task@v3
        with:
          version: "3.54.0"

      - name: 🧩 Gather dependencies
        run: nub ci

      - name: 🏗️ Assemble the site
        run: task build

      - name: 🔖 Verify the package version metadata
        run: task test:run

      - name: 🚀 Launch to Cloudflare
        run: task deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
