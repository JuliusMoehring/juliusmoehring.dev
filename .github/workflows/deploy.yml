name: 🚀 Deploy to Cloudflare

on:
  workflow_call:
    inputs:
      ref:
        description: Released commit SHA to validate and deploy
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

concurrency:
  group: cloudflare-production
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📦 Unpack the source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: ⚡ Power up Node & Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.11.1
          node-version-file: .node-version

      - name: 🛠️ Equip the task runner
        uses: arduino/setup-task@v3
        with:
          version: "3.54.0"

      - name: 🧩 Gather dependencies
        run: nub ci

      - name: 🏗️ Assemble the site
        run: task build

      - name: 🔖 Verify the package version metadata
        run: task test:run

      - name: 🚀 Launch to Cloudflare
        run: task deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
